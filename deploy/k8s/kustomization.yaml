# Apply everything with:
#   kubectl apply -k deploy/k8s
#
# Set your image here (or with `kubectl set image`) rather than editing the
# Deployment. Pin a digest or an exact tag once you cut a release.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: jabr

resources:
  - namespace.yaml
  - configmap.yaml
  - pvc.yaml
  - deployment.yaml
  - service.yaml
  - backup-script.yaml
  - backup-cronjob.yaml

images:
  - name: ghcr.io/geokkjer/jabr
    newTag: 0.1.0-beta.2

# Optional overrides, e.g.:
#   - a different StorageClass
#   - more replicas of anything (note: jabr itself cannot scale past 1)
# patches:
#   - path: patch-resources.yaml
