# JABR runs a single SQLite writer against a local volume, so this is a
# one-replica deployment by design. Do not scale it horizontally: two pods
# sharing the database would corrupt it.
#
# `strategy: Recreate` is required for the same reason. A RollingUpdate can
# briefly run two pods (a ReadWriteOnce volume allows that on a single node),
# and SQLite does not tolerate two writers.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jabr
  labels:
    app.kubernetes.io/name: jabr
    app.kubernetes.io/component: web
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: jabr
  template:
    metadata:
      labels:
        app.kubernetes.io/name: jabr
        app.kubernetes.io/component: web
    spec:
      # The server traps SIGTERM, drains in-flight requests and closes SQLite
      # before exiting — give it room to finish.
      terminationGracePeriodSeconds: 30

      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        # Makes freshly provisioned volumes writable by the node user instead
        # of root, which is what SQLite needs.
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault

      # Uncomment if the image lives in a private registry.
      # imagePullSecrets:
      #   - name: jabr-registry

      containers:
        - name: jabr
          image: ghcr.io/geokkjer/jabr:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3001
          envFrom:
            - configMapRef:
                name: jabr-config
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              cpu: "1"
              memory: 512Mi
          # Kubernetes ignores the image HEALTHCHECK, so probe explicitly.
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /app/data
            - name: books
              mountPath: /app/books
            # The server writes nothing to /tmp today, but multer and node
            # internals reserve the right to.
            - name: tmp
              mountPath: /tmp

      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: jabr-data
        - name: books
          persistentVolumeClaim:
            claimName: jabr-books
        - name: tmp
          emptyDir: {}
