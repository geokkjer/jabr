name: jabr

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: jabr-web
    ports:
      - "8080:3001"
    volumes:
      - data:/app/data
      - books:/app/books
    environment:
      NODE_ENV: production
      JABR_PORT: "3001"
      JABR_DB_PATH: /app/data/jabr.sqlite3
      JABR_BOOKS_PATH: /app/books
    restart: unless-stopped

volumes:
  data:
  books:
