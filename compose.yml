name: jabr

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: jabr-web
    ports:
      - "8080:3001"
    volumes:
      - data:/app/data
      - books:/app/books
    environment:
      NODE_ENV: production
      JABR_PORT: "3001"
      JABR_DB_PATH: /app/data/jabr.sqlite3
      JABR_BOOKS_PATH: /app/books
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3001/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 5s
      retries: 3
    restart: unless-stopped

volumes:
  data:
  books:
